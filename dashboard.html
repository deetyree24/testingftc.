<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Vault | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#eef2f7;

}

header{

height:70px;

background:#0f172a;

color:white;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 35px;

box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.logo{

font-size:24px;

font-weight:600;

}

.logout{

text-decoration:none;

background:#ef4444;

color:white;

padding:10px 18px;

border-radius:8px;

font-weight:600;

}

.logout:hover{

background:#dc2626;

}

.container{

max-width:1300px;

margin:auto;

padding:35px;

}

.welcome{

background:linear-gradient(135deg,#2563eb,#1d4ed8);

color:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(37,99,235,.3);

margin-bottom:30px;

}

.welcome h1{

font-size:34px;

margin-bottom:10px;

}

.cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;

margin-bottom:30px;

}

.card{

background:white;

padding:25px;

border-radius:18px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card h3{

color:#64748b;

margin-bottom:10px;

}

.card p{

font-size:18px;

font-weight:600;

color:#0f172a;

word-break:break-word;

}

.buttons{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

}

.btn{

display:block;

text-align:center;

text-decoration:none;

background:#2563eb;

color:white;

padding:16px;

border-radius:12px;

font-size:18px;

font-weight:600;

transition:.3s;

}

.btn:hover{

background:#1d4ed8;

}

@media(max-width:900px){

.cards{

grid-template-columns:1fr;

}

.buttons{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
🔐 Digital Vault
</div>

<a href="/logout" class="logout">
Logout
</a>

</header>

<div class="container">

<div class="welcome">

<h1 id="welcomeName">
Welcome
</h1>

<p>
Your secure vault is ready.
</p>

</div>

<div class="cards">

<div class="card">

<h3>Customer Name</h3>

<p id="customerName">
Loading...
</p>

</div>

<div class="card">

<h3>Email Address</h3>

<p id="customerEmail">
Loading...
</p>

</div>

<div class="card">

<h3>Account Status</h3>

<p>
🟢 Active
</p>

</div>

</div>

<div class="buttons">

<a href="account.html" class="btn">
🏦 Secure Account Details
</a>

<a href="profile.html" class="btn">
👤 My Profile
</a>

<a href="/logout" class="btn">
🚪 Logout
</a>

</div>

</div>

<script>

// =====================================
// Check User Session
// =====================================

async function loadUser() {

    try {

        const response = await fetch("/me");

        if (!response.ok) {

            window.location.href = "/login.html";
            return;

        }

        const user = await response.json();

        document.getElementById("welcomeName").innerHTML =
            "Welcome, " + user.fullname + " 👋";

        document.getElementById("customerName").innerHTML =
            user.fullname;

        document.getElementById("customerEmail").innerHTML =
            user.email;

    } catch (error) {

        console.error(error);

        window.location.href = "/login.html";

    }

}

// =====================================
// Auto Load
// =====================================

loadUser();

</script>

</body>

</html>
